    <style>@font-face{font-family:Inter Variable;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2)format("woff2-variations")}@font-face{font-family:Roboto Variable;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/roboto-latin-wght-normal.woff2)format("woff2-variations")}@font-face{font-family:Montserrat Variable;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-wght-normal.woff2)format("woff2-variations")}html,body{background:#1a252c;height:100%;margin:0;overflow:hidden}.pre{z-index:100;color:#f6f6f6;background:#1a252c;font-family:Inter Variable,ui-sans-serif,system-ui,sans-serif;position:fixed;inset:0}.pre-topo{justify-content:space-between;align-items:center;height:clamp(64px,7vw,92px);padding-inline:clamp(16px,4.4vw,72px);display:flex;position:absolute;inset:0 0 auto}.pre-marca{letter-spacing:.02em;align-items:center;gap:.75em;font:400 14px/1 Roboto Variable,ui-sans-serif,sans-serif;display:inline-flex}.pre-marca b{letter-spacing:.01em;font-family:Montserrat Variable,ui-sans-serif,sans-serif;font-weight:800}.pre-marca i{background:#e74c3c;width:13px;height:13px}.pre-frase{letter-spacing:.06em;color:#abafb1;font-size:12px;font-weight:600}.pre-pixels{width:min(30vw,34vh);position:absolute;top:50%;right:clamp(16px,9vw,160px);overflow:visible;transform:translateY(-58%)}.pre-pixels rect{fill:#f6f6f6;opacity:0;transform-box:fill-box;transform-origin:50%;transition:opacity .35s,transform .9s cubic-bezier(.16,1,.3,1);transform:translate(-40px)scale(.4)}.pre-pixels rect[data-c=coral]{fill:#e74c3c}.pre-pixels rect.on{opacity:1;transform:none}.pre-base{justify-content:space-between;align-items:flex-end;gap:24px;display:flex;position:absolute;bottom:clamp(28px,5vh,64px);left:clamp(16px,4.4vw,72px);right:clamp(16px,4.4vw,72px)}.pre-num{letter-spacing:-.045em;font-variant-numeric:tabular-nums;padding-block:.06em;font-size:clamp(70px,15vw,217px);font-weight:800;line-height:.86;display:block;overflow:hidden}.pre-num span{transition:transform .7s cubic-bezier(.16,1,.3,1);display:block}.pre-rotulo{letter-spacing:.14em;text-transform:uppercase;color:#e74c3c;padding-bottom:1.2em;font-size:12px;font-weight:700}.pre-barra{background:#f6f6f61f;height:3px;position:absolute;bottom:0;left:0;right:0}.pre-barra i{transform-origin:0;background:#e74c3c;position:absolute;inset:0;transform:scaleX(0)}.pre-grade{pointer-events:none;display:grid;position:absolute;inset:0}.pre-grade b{opacity:0;background:#1a252c}.pre.saindo{background:0 0}.pre.saindo .pre-grade b{opacity:1;animation:.34s forwards pre-dissolve}.pre.saindo .pre-topo,.pre.saindo .pre-pixels,.pre.saindo .pre-barra,.pre.saindo .pre-rotulo{opacity:0;transition:opacity .22s}.pre.saindo .pre-num span{transform:translateY(-105%)}@keyframes pre-dissolve{to{opacity:0}}@media (prefers-reduced-motion:reduce){.pre-pixels rect,.pre-num span{transition:none}.pre.saindo{opacity:0;transition:opacity .2s}.pre.saindo .pre-grade b{opacity:0;animation:none}}@media (max-width:720px){.pre-frase{display:none}.pre-pixels{width:44vw;top:38%;right:8vw}}</style>

  <body>
    <div class="pre" data-preloader aria-hidden="true">
      <div class="pre-grade" data-pre-grade></div>
      <div class="pre-topo">
        <span class="pre-marca"><i></i><span><b>REDPACK</b> STUDIO</span></span>

      </svg>
      <div class="pre-base">
        <span class="pre-num"><span data-pre-num>000</span></span>

    </div>
    <div id="root"></div>
    <script>
      // Preloader do contrato. Conta 0→100 sozinho (tempo mínimo + espera o app avisar que
      // fontes, seções e cena carregaram), nunca passa do teto, e se dissolve em pixels em ~1s.
      ;(function () {
        var pre = document.querySelector('[data-preloader]')
        if (!pre) return
        var num = pre.querySelector('[data-pre-num]')
        var barra = pre.querySelector('[data-pre-barra]')
        var pixels = pre.querySelectorAll('[data-pre-pixel]')
        var grade = pre.querySelector('[data-pre-grade]')
        var reduz = matchMedia('(prefers-reduced-motion: reduce)').matches
        var MIN = reduz ? 350 : 1500
        var TETO = reduz ? 1500 : 3400
        var t0 = performance.now()
        var atual = 0
        var appPronto = false
        var fim = false
        window.__preloader = { pronto: function () { appPronto = true } }
        function quadro(t) {
          var dt = t - t0
          var alvo = 92 * (1 - Math.pow(1 - Math.min(1, dt / MIN), 3))
          if ((appPronto && dt >= MIN) || dt >= TETO) alvo = 100
          atual += (alvo - atual) * (reduz ? 1 : 0.14)
          if (alvo === 100 && atual > 99.4) atual = 100
          var n = Math.floor(atual)
          num.textContent = (n < 10 ? '00' : n < 100 ? '0' : '') + n
          barra.style.transform = 'scaleX(' + (atual / 100).toFixed(4) + ')'
          for (var i = 0; i < pixels.length; i++) {
            if (atual / 100 >= (i + 1) / (pixels.length + 1)) pixels[i].classList.add('on')
          }
          if (atual >= 100) return sair()
          requestAnimationFrame(quadro)
        }
        function sair() {
          if (fim) return
          fim = true
          // a grade de pixels cobre a tela e cada célula some no seu tempo
          var col = Math.max(4, Math.round(innerWidth / 110))
          var lin = Math.max(4, Math.round(innerHeight / 110))
          grade.style.gridTemplateColumns = 'repeat(' + col + ', 1fr)'
          grade.style.gridTemplateRows = 'repeat(' + lin + ', 1fr)'
          var html = ''
          for (var k = 0; k < col * lin; k++) html += '<b style="animation-delay:' + Math.round(180 + Math.random() * 520) + 'ms"></b>'
          grade.innerHTML = html
          pre.classList.add('saindo')
          window.__redpackPronto = true
          window.dispatchEvent(new Event('redpack:pronto'))
          setTimeout(function () { pre.remove() }, reduz ? 260 : 1000)
        }
        requestAnimationFrame(quadro)
      })()
    </script>
  </body>
